
stages:
  - build
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

# Cache Rust dependencies for faster builds
.rust_cache: &rust_cache
  cache:
    key: 
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/

build:
  stage: build
  image: rust:latest
  <<: *rust_cache
  script:
    - cargo build --verbose
    - cargo test --verbose
  rules:
    - if: $CI_COMMIT_TAG == null

build-release:
  stage: build
  image: rust:latest
  <<: *rust_cache
  before_script:
    - rustup target add x86_64-unknown-linux-musl
    - apt-get update && apt-get install -y gcc-x86-64-linux-gnu musl-tools gcc-multilib
  script:
    - cargo build --release --target x86_64-unknown-linux-musl --verbose
    - strip target/x86_64-unknown-linux-musl/release/$CI_PROJECT_NAME || true
    - mkdir -p artifacts/
    - cp target/x86_64-unknown-linux-musl/release/$CI_PROJECT_NAME artifacts/
    - ls -la artifacts/
    - file artifacts/$CI_PROJECT_NAME  
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG  

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-release
      artifacts: true
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "$CI_PROJECT_NAME-binary"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/artifacts/$CI_PROJECT_NAME?job=build-release"
          filepath: "/artifacts/$CI_PROJECT_NAME"
  rules:
    - if: $CI_COMMIT_TAG