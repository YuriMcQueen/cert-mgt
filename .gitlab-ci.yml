stages:
  - build
  - release

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

.rust_cache: &rust_cache
  cache:
    key:
      files:
        - Cargo.lock
    paths:
      - .cargo/
      - target/

build:
  stage: build
  image: rust:latest
  <<: *rust_cache
  script:
    - rustup component add clippy
    - cargo clippy --all-targets
    - cargo build --verbose
    - cargo test --verbose
  rules:
    - if: $CI_COMMIT_TAG == null

build-release:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "Waiting for Docker daemon..."
    - until docker info >/dev/null 2>&1; do
        sleep 1;
      done
    - echo "Docker daemon is ready."
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
  script:
    - docker buildx build \
        --platform linux/amd64 \
        --output type=local,dest=./artifacts \
        .
    - ls -la artifacts/
    - file artifacts/$CI_PROJECT_NAME || true
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-release
      artifacts: true
  script:
    - echo "Creating release for tag $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "$CI_PROJECT_NAME-binary"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/artifacts/$CI_PROJECT_NAME?job=build-release"
          filepath: "/artifacts/$CI_PROJECT_NAME"
  rules:
    - if: $CI_COMMIT_TAG
