[workspace]
members = [
    "certmgt-lib",
    "certmgt-cli",
]
resolver = "2"

[workspace.dependencies]
openssl = "0.10"
polars = { version = "0.49.1", features = ["lazy", "parquet", "json", "temporal", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
toml = "0.9.2"

# Optional: Set default settings for all crates
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"
