[workspace]
members = [
    "certmgt-lib",
    "certmgt-cli",
]
resolver = "2"

[workspace.dependencies]
openssl = "0.10"
x509-parser = "0.17.0"
#polars = { version = "0.49.1", features = ["lazy", "parquet"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
clap = { version = "4.5.42", features = ["derive"] }
tokio = { version = "1.47.0", features = ["rt-multi-thread", "macros", "net", "fs"] }
anyhow = "1.0"
toml = "0.9.2"
rpassword = "7.4.0"
ratatui = "0.29.0"
crossterm = "0.29.0"
flate2 = "1.1.2"
thiserror = "2.0.12"

# Optional: Set default settings for all crates
[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Your Name <your.email@example.com>"]
license = "MIT OR Apache-2.0"


[profile.release]
opt-level = "z"  # Optimize for size
lto = true       # Link-time optimization
codegen-units = 1
panic = "abort"
strip = true